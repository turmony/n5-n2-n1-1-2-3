[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jlpt-notes"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
  "bleach>=6,<7",
]

[project.entry-points."mkdocs.plugins"]
jlpt_reader = "jlpt_notes.reader.plugin:JlptReaderPlugin"
